{% extends "base.html" %}

{% block title %}{{ company_name }} | Admin Login{% endblock %}

{% block content %}
<section class="center-wrap">
  <div class="card login-card">
    <h1>Admin login</h1>
    <p>Enter your admin password to access the dashboard.</p>

    <form method="POST" action="{{ url_for('admin_login') }}" class="stack-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-wide">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
