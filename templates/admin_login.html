{% extends "base.html" %}

{% block title %}{{ company_name }} | Admin Login{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Admin Login</h1>
  <p>Access the SJM service plan dashboard.</p>
</section>

<div class="card login-card">
  <form method="POST" class="login-form">
    
    <div class="field full">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Enter admin password" 
        required
      >
    </div>

    <div class="field full">
      <button type="submit" class="btn btn-primary btn-wide">
        Log in
      </button>
    </div>

  </form>
</div>
{% endblock %}
