{% extends "base.html" %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}
<div class="card warning-card">
  <h1>{{ cancel_title or "Payment cancelled" }}</h1>

  <p>
    {{ cancel_message or "Your payment was not completed." }}
  </p>

  <a href="{{ return_url or url_for('signup') }}" class="btn btn-primary">
    {{ return_text or "Try again" }}
  </a>
</div>
{% endblock %}
